name: Build AV App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build APK using Buildozer Action
      uses: ArtemShatalov/buildozer-action@v1
      with:
        buildozer_version: stable
        command: buildozer android debug
        repository_root: .

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: AV-App-Installer
        path: bin/*.apk
